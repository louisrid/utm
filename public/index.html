<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#000000"><title>AUTOMATIC X TRACKER</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script></head><body><div class="shell"><header class="topbar"><div class="brand"><span class="brand-name">AUTOMATIC X TRACKER</span></div><div class="top-right"><span class="dot" id="headerDot"></span><span class="top-label" id="headerStatus">CONNECTING</span></div></header><section class="login-panel" id="loginPanel"><h1>AUTOMATIC X TRACKER</h1><p>Enter your password.</p><form id="loginForm"><label for="password">PASSWORD</label><div class="login-form-row"><input id="password" type="password" required placeholder="Password" autocomplete="current-password"><button class="btn primary" type="submit">LOG IN</button></div><div class="error" id="loginError" role="alert"></div></form></section><main id="dashboard" hidden><section class="intro"><h1>AUTOMATIC X TRACKER</h1><div class="intro-actions"><a id="sourceLink" class="btn" target="_blank" rel="noopener noreferrer">OPEN SHEET</a><button id="refreshButton" class="btn primary" type="button">REFRESH</button></div></section><section class="stats" aria-label="Campaign overview"><div class="stat-card"><div class="stat-head">CLICKS</div><div id="statClicks" class="stat-value">—</div></div><div class="stat-card"><div class="stat-head">PUBLISHED</div><div id="statPosted" class="stat-value">—</div></div><div class="stat-card"><div class="stat-head">SPEND (USD)</div><div id="statSpend" class="stat-value">—</div></div><div class="stat-card"><div class="stat-head">COST / CLICK</div><div id="statCpc" class="stat-value">—</div></div></section><section class="table-card"><div class="table-
